name: Validate Release Workflow

on:
  pull_request:
    paths:
      - '.github/workflows/auto-version.yml'
      - '.github/workflows/validate-gh-sfl.yml'
      - '.github/workflows/validate-release-workflow.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-version.yml'
      - '.github/workflows/validate-gh-sfl.yml'
      - '.github/workflows/validate-release-workflow.yml'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-verified actionlint
        id: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "executable=${RUNNER_TEMP}/actionlint" >> "$GITHUB_OUTPUT"

      - name: Validate release workflows
        shell: bash
        run: |
          "${{ steps.actionlint.outputs.executable }}" -color \
            .github/workflows/auto-version.yml \
            .github/workflows/validate-gh-sfl.yml \
            .github/workflows/validate-release-workflow.yml
