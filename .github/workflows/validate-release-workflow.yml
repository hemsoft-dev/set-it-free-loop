name: Validate Release Workflow

on:
  pull_request:
    paths:
      - '.github/workflows/publish-private-prerelease.yml'
      - '.github/workflows/validate-gh-sfl.yml'
      - '.github/workflows/validate-release-workflow.yml'
      - '.github/workflows/verify-sfl-app-credential.yml'
      - 'deployment/scripts/build-release-artifacts.ps1'
      - 'deployment/scripts/install-gh-sfl-hemsoft.ps1'
      - 'deployment/scripts/set-release-protection.ps1'
      - 'deployment/scripts/set-release-version.ps1'
      - 'deployment/tests/test-release-metadata.ps1'
      - 'deployment/tests/test-release-installer.ps1'
      - 'VERSION'
      - 'deployment/legacy-source-manifest.json'
      - 'deployment/release-metadata.json'
      - 'gh-sfl/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-private-prerelease.yml'
      - '.github/workflows/validate-gh-sfl.yml'
      - '.github/workflows/validate-release-workflow.yml'
      - '.github/workflows/verify-sfl-app-credential.yml'
      - 'deployment/scripts/build-release-artifacts.ps1'
      - 'deployment/scripts/install-gh-sfl-hemsoft.ps1'
      - 'deployment/scripts/set-release-protection.ps1'
      - 'deployment/scripts/set-release-version.ps1'
      - 'deployment/tests/test-release-metadata.ps1'
      - 'deployment/tests/test-release-installer.ps1'
      - 'VERSION'
      - 'deployment/legacy-source-manifest.json'
      - 'deployment/release-metadata.json'
      - 'gh-sfl/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: gh-sfl/go.mod
          cache-dependency-path: gh-sfl/go.sum

      - name: Install checksum-verified actionlint
        id: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "executable=${RUNNER_TEMP}/actionlint" >> "$GITHUB_OUTPUT"

      - name: Validate release workflows
        shell: bash
        run: |
          "${{ steps.actionlint.outputs.executable }}" -color \
            .github/workflows/publish-private-prerelease.yml \
            .github/workflows/validate-gh-sfl.yml \
            .github/workflows/validate-release-workflow.yml \
            .github/workflows/verify-sfl-app-credential.yml

      - name: Validate synchronized release contract
        shell: pwsh
        run: |
          ./deployment/tests/test-release-metadata.ps1
          ./deployment/tests/test-release-installer.ps1

      - name: Build release contract artifacts
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          ./deployment/scripts/build-release-artifacts.ps1 `
            -Version $version `
            -BuildDate '2026-08-13' `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'release-contract')

      - name: Verify release contract checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release-contract"
          sha256sum --check SHA256SUMS
