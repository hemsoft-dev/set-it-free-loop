name: Seal SFL App credential for selected organization pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seal-sfl-org-credential-${{ github.actor }}-${{ github.triggering_actor }}
  cancel-in-progress: false

jobs:
  trusted-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require an owner-dispatched trusted source main
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or
              $env:GITHUB_REPOSITORY_ID -cne '1169772257' -or
              $env:GITHUB_REPOSITORY -cnotin @('HemSoft/set-it-free-loop', 'hemsoft-dev/set-it-free-loop') -or
              $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_ACTOR -cne 'HemSoft' -or $env:GITHUB_TRIGGERING_ACTOR -cne 'HemSoft') {
            throw 'Credential sealing requires an owner-dispatched trusted source main.'
          }
  seal:
    needs: trusted-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install declared Go toolchain without credentials
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: deployment/orgseal/go.mod
          cache-dependency-path: deployment/orgseal/go.sum
      - name: Build the reviewed sealing helper without credentials
        working-directory: deployment/orgseal
        run: go build -mod=readonly -o ../../orgseal .
      - name: Verify the existing App key and seal for the reviewed public recipient
        shell: pwsh
        env:
          SFL_APP_CLIENT_ID: ${{ vars.SFL_APP_CLIENT_ID }}
          SFL_APP_PRIVATE_KEY: ${{ secrets.SFL_APP_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            if ($env:SFL_APP_CLIENT_ID -cne 'Iv23liwvwJJUh2bUIKLW' -or
                [string]::IsNullOrWhiteSpace($env:SFL_APP_PRIVATE_KEY)) {
              throw 'Configured App identity or key is missing.'
            }
            Import-Module ./deployment/scripts/SflGitHubAppBootstrap.psm1 -Force
            $jwt = ConvertTo-SflGitHubAppJwt -ClientId $env:SFL_APP_CLIENT_ID -PrivateKeyPem $env:SFL_APP_PRIVATE_KEY
            Write-Output "::add-mask::$jwt"
            $identity = Get-SflGitHubAppIdentity -Jwt $jwt
            Assert-SflGitHubAppIdentity -Identity $identity -ExpectedAppId '4448946' `
              -ExpectedClientId 'Iv23liwvwJJUh2bUIKLW' -ExpectedOwner $env:GITHUB_REPOSITORY_OWNER
            $installation = Get-SflGitHubAppRepositoryInstallation -Repository $env:GITHUB_REPOSITORY -Jwt $jwt
            Assert-SflGitHubAppInstallation -Installation $installation -Repository $env:GITHUB_REPOSITORY `
              -ExpectedAppId '4448946' -ExpectedClientId 'Iv23liwvwJJUh2bUIKLW' -ExpectedOwner $env:GITHUB_REPOSITORY_OWNER
            if ($installation.repository_selection -cne 'all') { throw 'The source installation must cover all repositories.' }
            & ./orgseal
            if ($LASTEXITCODE -ne 0) { throw 'Credential sealing failed.' }
            $metadata = [ordered]@{
              repository_id = [long]$env:GITHUB_REPOSITORY_ID
              repository = $env:GITHUB_REPOSITORY
              reviewed_sha = $env:GITHUB_SHA
              run_id = [long]$env:GITHUB_RUN_ID
              run_attempt = [long]$env:GITHUB_RUN_ATTEMPT
              app_id = [long]$identity.id
              client_id = [string]$identity.client_id
              owner = [string]$identity.owner.login
              installation_id = [long]$installation.id
              repository_selection = [string]$installation.repository_selection
              permission_ceiling_verified = $true
              credential_verification = 'success'
              observed_at = [DateTimeOffset]::UtcNow.ToString('o')
            }
            $metadata | ConvertTo-Json | Set-Content ./sealed-sfl-app-metadata.json -Encoding utf8
          } catch {
            Remove-Item ./sealed-sfl-app-credential.json, ./sealed-sfl-app-metadata.json -ErrorAction SilentlyContinue
            throw 'App validation or sealing failed. No credential or provider response is reported.'
          } finally {
            $jwt = $null
            Remove-Item Env:SFL_APP_PRIVATE_KEY -ErrorAction SilentlyContinue
          }
      - name: Upload ciphertext and allowlisted authentication metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-sfl-app-credential
          path: |
            sealed-sfl-app-credential.json
            sealed-sfl-app-metadata.json
          if-no-files-found: error
          retention-days: 1
