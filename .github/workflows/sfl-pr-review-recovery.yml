# HemSoft SFL reviewer platform v2
name: SFL PR Review Recovery

on:
  workflow_run:
    workflows: ["SFL PR Review"]
    types: [completed]

permissions:
  contents: read

jobs:
  recover:
    if: >-
      vars.SFL_ENABLED != 'false' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.path == '.github/workflows/sfl-pr-review.lock.yml' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-slim
    steps:
      - name: Configure GH_HOST for enterprise compatibility
        shell: bash
        run: |
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"

      - name: Mint SFL GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SFL_APP_CLIENT_ID }}
          private-key: ${{ secrets.SFL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-contents: read
          permission-pull-requests: read

      - name: Retry missing review output once
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FAILED_RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          SFL_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          # BEGIN TESTABLE REVIEW RECOVERY POLICY
          reconcile_review_count() {
            local manifest_review_count="$1"
            local published_review_count="$2"

            if [ "$manifest_review_count" -gt "$published_review_count" ]; then
              echo "$manifest_review_count"
            else
              echo "$published_review_count"
            fi
          }

          decide_review_recovery() {
            local terminal_signal_count="$1"
            local review_count="$2"
            local retry_count="$3"
            local expected_head="$4"
            local live_head="$5"
            local expected_base="$6"
            local live_base="$7"
            local eligible="$8"

            if [ "$review_count" -eq 1 ]; then
              echo "complete"
              return 0
            fi
            if [ "$review_count" -ne 0 ]; then
              echo "invalid"
              return 1
            fi
            if [ "$terminal_signal_count" -ne 0 ]; then
              echo "reported"
              return 0
            fi
            if [ "$eligible" != "true" ] \
              || [ "$live_head" != "$expected_head" ] \
              || [ "$live_base" != "$expected_base" ]; then
              echo "stale"
              return 0
            fi
            if [ "$retry_count" -eq 0 ]; then
              echo "retry"
              return 0
            fi
            echo "exhausted"
            return 1
          }

          newer_run_suppresses_retry() {
            local run_status="$1"
            local provenance_loaded="$2"
            local provenance_match="$3"
            local title_match="$4"

            # A newer run whose provenance matches this exact PR/base/head
            # owns the current-state review, regardless of requested effort.
            if [ "$provenance_match" = "true" ]; then
              echo "suppress"
              return 0
            fi
            # An active newer run whose provenance has not materialized yet
            # suppresses only when its sealed display title identifies this
            # exact PR/base/head. A completed run needs matching provenance:
            # otherwise it may have failed before uploading the artifact and
            # still needs this older run's recovery attempt.
            if [ "$run_status" != "completed" ] \
              && [ "$provenance_loaded" != "true" ] \
              && [ "$title_match" = "true" ]; then
              echo "suppress"
              return 0
            fi
            echo "allow"
            return 0
          }
          # END TESTABLE REVIEW RECOVERY POLICY

          ARTIFACT_DIR=$(mktemp -d)
          trap 'rm -rf "$ARTIFACT_DIR"' EXIT
          mkdir -p \
            "$ARTIFACT_DIR/agent" \
            "$ARTIFACT_DIR/provenance" \
            "$ARTIFACT_DIR/safe-outputs"

          PROVENANCE_LOADED="false"
          for PROVENANCE_ATTEMPT in 1 2 3; do
            rm -rf "$ARTIFACT_DIR/provenance"
            mkdir -p "$ARTIFACT_DIR/provenance"
            if gh run download "$FAILED_RUN_ID" \
              --repo "$REPOSITORY" \
              --name sfl-review-run-provenance \
              --dir "$ARTIFACT_DIR/provenance"; then
              PROVENANCE_LOADED="true"
              break
            fi
            if [ "$PROVENANCE_ATTEMPT" -lt 3 ]; then
              sleep $((PROVENANCE_ATTEMPT * 5))
            fi
          done
          if [ "$PROVENANCE_LOADED" != "true" ]; then
            echo "::error::Could not load exact review provenance for run ${FAILED_RUN_ID}"
            exit 1
          fi

          AGENT_OUTPUT="$ARTIFACT_DIR/agent/agent_output.json"
          PROVENANCE="$ARTIFACT_DIR/provenance/sfl-review-run-provenance.json"
          SAFE_OUTPUT_ITEMS="$ARTIFACT_DIR/safe-outputs/safe-output-items.jsonl"
          for AGENT_ATTEMPT in 1 2 3; do
            rm -rf "$ARTIFACT_DIR/agent"
            mkdir -p "$ARTIFACT_DIR/agent"
            if gh run download "$FAILED_RUN_ID" \
              --repo "$REPOSITORY" \
              --name agent \
              --dir "$ARTIFACT_DIR/agent"; then
              break
            fi
            if [ "$AGENT_ATTEMPT" -lt 3 ]; then
              sleep $((AGENT_ATTEMPT * 5))
            fi
          done
          if ! gh run download "$FAILED_RUN_ID" \
            --repo "$REPOSITORY" \
            --name safe-outputs-items \
            --dir "$ARTIFACT_DIR/safe-outputs"; then
            echo "No durable safe-output artifact exists for run ${FAILED_RUN_ID}; reconciling published reviews"
            : > "$SAFE_OUTPUT_ITEMS"
          fi
          if [ ! -f "$PROVENANCE" ]; then
            echo "::error::Review recovery provenance is incomplete"
            exit 1
          fi
          if ! jq -e \
            --arg repository "$REPOSITORY" \
            --arg workflow_run_id "$FAILED_RUN_ID" \
            '
              .repository == $repository and
              .workflow_run_id == $workflow_run_id and
              (.pr_number | type) == "number" and
              (.pr_number | floor) == .pr_number and
              .pr_number > 0 and
              (.base_sha | test("^[0-9a-f]{40}$")) and
              (.head_sha | test("^[0-9a-f]{40}$")) and
              (.review_effort | test("^(low|medium|high)$")) and
              (.retry_count == 0 or .retry_count == 1)
            ' "$PROVENANCE" >/dev/null; then
            echo "::error::Review recovery provenance is invalid or mismatched"
            exit 1
          fi

          PR_NUMBER=$(jq -r '.pr_number' "$PROVENANCE")
          BASE_SHA=$(jq -r '.base_sha' "$PROVENANCE")
          HEAD_SHA=$(jq -r '.head_sha' "$PROVENANCE")
          REVIEW_EFFORT=$(jq -r '.review_effort' "$PROVENANCE")
          RETRY_COUNT=$(jq -r '.retry_count' "$PROVENANCE")
          if ! MANIFEST_REVIEW_COUNT=$(jq -s \
            '[
              .[] |
              select(.type == "submit_pull_request_review")
            ] | length' \
            "$SAFE_OUTPUT_ITEMS"); then
            echo "::error::Review safe-output manifest is malformed"
            exit 1
          fi

          if [ -z "$SFL_APP_SLUG" ]; then
            echo "::error::Could not identify the trusted SFL GitHub App"
            exit 1
          fi
          APP_LOGIN="${SFL_APP_SLUG}[bot]"
          PUBLISHED_REVIEWS=$(gh api \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            --paginate \
            --slurp)
          if ! PUBLISHED_REVIEW_COUNT=$(jq -r \
            --arg app_login "$APP_LOGIN" \
            --arg head_sha "$HEAD_SHA" \
            --arg workflow_run_id "$FAILED_RUN_ID" \
            '
              [
                .[] |
                .[] |
                select(
                  ((.user.login // "") | ascii_downcase) ==
                    ($app_login | ascii_downcase) and
                  .commit_id == $head_sha and
                  (
                    (.body // "") |
                    contains("/actions/runs/" + $workflow_run_id)
                  )
                )
              ] | length
            ' <<< "$PUBLISHED_REVIEWS"); then
            echo "::error::Could not reconcile published reviews for run ${FAILED_RUN_ID}"
            exit 1
          fi
          REVIEW_COUNT=$(reconcile_review_count \
            "$MANIFEST_REVIEW_COUNT" \
            "$PUBLISHED_REVIEW_COUNT")

          if [ "$REVIEW_COUNT" -eq 1 ]; then
            echo "Run ${FAILED_RUN_ID} produced its formal review; no missing-output retry is allowed"
            exit 0
          fi
          if [ "$REVIEW_COUNT" -gt 1 ]; then
            echo "::error::Run ${FAILED_RUN_ID} produced multiple formal reviews"
            exit 1
          fi

          # gh-aw omits metadata-only signals from the durable manifest. A
          # retry is safe only after proving the agent emitted no terminal
          # missing-data/tool/incomplete-report signal.
          if [ ! -f "$AGENT_OUTPUT" ]; then
            echo "::error::Review agent output is unavailable; refusing an unproven retry"
            exit 1
          fi
          if ! TERMINAL_SIGNAL_COUNT=$(jq -r \
            '
              if (.items | type) != "array" then
                error("agent output items must be an array")
              else
                [
                  .items[] |
                  select(
                    .type == "missing_data" or
                    .type == "missing_tool" or
                    .type == "report_incomplete"
                  )
                ] | length
              end
            ' "$AGENT_OUTPUT"); then
            echo "::error::Review agent output is malformed; refusing an unproven retry"
            exit 1
          fi

          PULL_REQUEST=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")
          LIVE_HEAD=$(jq -r '.head.sha // empty' <<< "$PULL_REQUEST")
          LIVE_BASE=$(jq -r '.base.sha // empty' <<< "$PULL_REQUEST")
          ELIGIBLE=$(jq -r \
            --arg default_branch "$DEFAULT_BRANCH" \
            --arg repository "$REPOSITORY" \
            '
              (
                .state == "open" and
                .draft == false and
                .base.ref == $default_branch and
                .head.repo.full_name == $repository
              ) | tostring
            ' <<< "$PULL_REQUEST")

          DECISION_STATUS=0
          DECISION=$(decide_review_recovery \
            "$TERMINAL_SIGNAL_COUNT" \
            "$REVIEW_COUNT" \
            "$RETRY_COUNT" \
            "$HEAD_SHA" \
            "$LIVE_HEAD" \
            "$BASE_SHA" \
            "$LIVE_BASE" \
            "$ELIGIBLE") || DECISION_STATUS=$?
          case "$DECISION" in
            complete)
              exit 0
              ;;
            reported)
              echo "Run ${FAILED_RUN_ID} produced an explicit non-review safe output; preserving its failed gate without retry"
              exit 0
              ;;
            stale)
              echo "PR #${PR_NUMBER} is no longer eligible at ${HEAD_SHA}; suppressing stale retry"
              exit 0
              ;;
            exhausted)
              echo "::error::PR #${PR_NUMBER} produced no formal review after its one trusted retry"
              exit "$DECISION_STATUS"
              ;;
            invalid)
              echo "::error::PR #${PR_NUMBER} produced an invalid formal-review count"
              exit "$DECISION_STATUS"
              ;;
            retry)
              ;;
            *)
              echo "::error::Unknown review recovery decision: ${DECISION}"
              exit 1
              ;;
          esac

          WORKFLOW_RUNS=$(gh api \
            "repos/${REPOSITORY}/actions/workflows/sfl-pr-review.lock.yml/runs?event=workflow_dispatch&per_page=100" \
            --paginate \
            --slurp)
          EXPECTED_REVIEW_TITLE_PREFIX="SFL PR Review #${PR_NUMBER} ${BASE_SHA}:${HEAD_SHA} retry="
          NEWER_RUNS=$(jq -r \
            --arg created_at "$FAILED_RUN_CREATED_AT" \
            '
              .[] |
              .workflow_runs[] |
              select(.created_at > $created_at and .conclusion != "cancelled") |
              [.id, .status, (.display_title // "")] |
              @tsv
            ' <<< "$WORKFLOW_RUNS")
          while IFS=$'\t' read -r NEWER_RUN_ID NEWER_RUN_STATUS NEWER_RUN_TITLE; do
            [ -n "$NEWER_RUN_ID" ] || continue
            NEWER_PROVENANCE_DIR="$ARTIFACT_DIR/newer-${NEWER_RUN_ID}"
            # The sealed title is computed first: an unrelated newer run
            # provably targets a different PR/base/head, so it earns a
            # single provenance attempt instead of the full in-flight
            # polling window — 12 attempts (~330s) per unrelated run could
            # outlast the recovery grace and hand the failed PR
            # a premature sfl-human-required escalation.
            NEWER_TITLE_MATCH="false"
            case "$NEWER_RUN_TITLE" in
              "$EXPECTED_REVIEW_TITLE_PREFIX"*) NEWER_TITLE_MATCH="true" ;;
            esac
            NEWER_PROVENANCE_ATTEMPTS=1
            if [ "$NEWER_RUN_STATUS" != "completed" ] \
              && [ "$NEWER_TITLE_MATCH" = "true" ]; then
              NEWER_PROVENANCE_ATTEMPTS=12
            fi
            NEWER_PROVENANCE_LOADED="false"
            NEWER_PROVENANCE_MATCH="false"
            for NEWER_PROVENANCE_ATTEMPT in $(seq 1 "$NEWER_PROVENANCE_ATTEMPTS"); do
              rm -rf "$NEWER_PROVENANCE_DIR"
              mkdir -p "$NEWER_PROVENANCE_DIR"
              if gh run download "$NEWER_RUN_ID" \
                --repo "$REPOSITORY" \
                --name sfl-review-run-provenance \
                --dir "$NEWER_PROVENANCE_DIR" \
                >/dev/null 2>&1; then
                NEWER_PROVENANCE_LOADED="true"
                if jq -e \
                  --argjson pr_number "$PR_NUMBER" \
                  --arg base_sha "$BASE_SHA" \
                  --arg head_sha "$HEAD_SHA" \
                  '
                    .pr_number == $pr_number and
                    .base_sha == $base_sha and
                    .head_sha == $head_sha
                  ' "$NEWER_PROVENANCE_DIR/sfl-review-run-provenance.json" \
                  >/dev/null; then
                  NEWER_PROVENANCE_MATCH="true"
                fi
                break
              fi
              if [ "$NEWER_PROVENANCE_ATTEMPT" -lt "$NEWER_PROVENANCE_ATTEMPTS" ]; then
                sleep $((NEWER_PROVENANCE_ATTEMPT * 5))
              fi
            done
            if [ "$(newer_run_suppresses_retry \
              "$NEWER_RUN_STATUS" \
              "$NEWER_PROVENANCE_LOADED" \
              "$NEWER_PROVENANCE_MATCH" \
              "$NEWER_TITLE_MATCH")" != "suppress" ]; then
              continue
            fi
            if [ "$NEWER_PROVENANCE_MATCH" = "true" ]; then
              echo "A newer review run already owns PR #${PR_NUMBER} at ${HEAD_SHA}; suppressing duplicate retry"
            else
              echo "A newer in-progress review for PR #${PR_NUMBER} at ${BASE_SHA}:${HEAD_SHA} has unavailable provenance; suppressing duplicate retry"
            fi
            exit 0
          done <<< "$NEWER_RUNS"

          AW_CONTEXT=$(jq -cn \
            --arg base_sha "$BASE_SHA" \
            --arg head_sha "$HEAD_SHA" \
            --argjson item_number "$PR_NUMBER" \
            '{item_type: "pull_request", item_number: $item_number, base_sha: $base_sha, head_sha: $head_sha}')
          dispatch_args=(
            --method POST
            "repos/${REPOSITORY}/actions/workflows/sfl-pr-review.lock.yml/dispatches"
            -f "ref=${DEFAULT_BRANCH}"
            -f "inputs[item_number]=${PR_NUMBER}"
            -f "inputs[base_sha]=${BASE_SHA}"
            -f "inputs[head_sha]=${HEAD_SHA}"
            -f "inputs[retry_count]=1"
            -f "inputs[aw_context]=${AW_CONTEXT}"
          )
          base_workflow="$(gh api \
            --method GET \
            "repos/${REPOSITORY}/contents/.github/workflows/sfl-pr-review.lock.yml" \
            -f "ref=${DEFAULT_BRANCH}" \
            -H "Accept: application/vnd.github.raw+json")"
          if grep -qE '^\s+review_effort:\s*$' <<< "${base_workflow}"; then
            dispatch_args+=(-f "inputs[review_effort]=${REVIEW_EFFORT}")
          fi
          if grep -qE '^\s+dispatch_id:\s*$' <<< "${base_workflow}"; then
            dispatch_args+=(-f "inputs[dispatch_id]=recovery-${GITHUB_RUN_ID}")
          fi

          # Last-moment interlock: the artifact/provenance checks above can be
          # slow. Revalidate both immutable PR state and newer-run ownership
          # immediately before dispatch so a stale retry cannot cancel a newer
          # current-state review through the shared reviewer concurrency group.
          FINAL_PULL_REQUEST=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")
          if ! jq -e \
            --arg base_sha "$BASE_SHA" \
            --arg default_branch "$DEFAULT_BRANCH" \
            --arg head_sha "$HEAD_SHA" \
            --arg repository "$REPOSITORY" \
            '
              .state == "open" and
              .draft == false and
              .base.ref == $default_branch and
              .base.sha == $base_sha and
              .head.repo.full_name == $repository and
              .head.sha == $head_sha
            ' <<< "$FINAL_PULL_REQUEST" >/dev/null; then
            echo "PR #${PR_NUMBER} changed before recovery dispatch; suppressing stale retry"
            exit 0
          fi
          FINAL_NEWER_RUN_ID=$(gh api \
            "repos/${REPOSITORY}/actions/workflows/sfl-pr-review.lock.yml/runs?event=workflow_dispatch&per_page=100" \
            | jq -r \
              --arg expected_title "$EXPECTED_REVIEW_TITLE_PREFIX" \
              --argjson failed_run_id "$FAILED_RUN_ID" '
                [.workflow_runs[]
                  | select(.id > $failed_run_id)
                  | select(.conclusion != "cancelled")
                  | select((.display_title // "") | startswith($expected_title))]
                | sort_by(.id)
                | last
                | .id // empty
              ')
          if [[ "$FINAL_NEWER_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Newer review run ${FINAL_NEWER_RUN_ID} acquired PR #${PR_NUMBER} before recovery dispatch; suppressing duplicate retry"
            exit 0
          fi
          gh api "${dispatch_args[@]}"
          echo "Dispatched one trusted missing-output retry for PR #${PR_NUMBER} at ${HEAD_SHA}"
