name: Verify owned SFL App credential

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-sfl-app-credential
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository_id == '1169772257' &&
      (github.repository == 'HemSoft/set-it-free-loop' ||
       github.repository == 'hemsoft-dev/set-it-free-loop') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify App identity and source installation using GET requests
        shell: pwsh
        env:
          SFL_APP_ID: ${{ vars.SFL_APP_ID }}
          SFL_APP_CLIENT_ID: ${{ vars.SFL_APP_CLIENT_ID }}
          SFL_APP_PRIVATE_KEY: ${{ secrets.SFL_APP_PRIVATE_KEY }}
          EXPECTED_OWNER: ${{ github.repository_owner }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SFL_APP_ID -cne '4448946' -or
              $env:SFL_APP_CLIENT_ID -cne 'Iv23liwvwJJUh2bUIKLW') {
            throw 'Configured public App identity does not match the approved SFL App.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SFL_APP_PRIVATE_KEY)) {
            throw 'The source repository has no SFL App credential available.'
          }
          Import-Module ./deployment/scripts/SflGitHubAppBootstrap.psm1 -Force
          try {
            $jwt = ConvertTo-SflGitHubAppJwt -ClientId $env:SFL_APP_CLIENT_ID -PrivateKeyPem $env:SFL_APP_PRIVATE_KEY
            Write-Output "::add-mask::$jwt"
            $identity = Get-SflGitHubAppIdentity -Jwt $jwt
            Assert-SflGitHubAppIdentity -Identity $identity -ExpectedAppId '4448946' `
              -ExpectedClientId 'Iv23liwvwJJUh2bUIKLW' -ExpectedOwner $env:EXPECTED_OWNER
            $installation = Get-SflGitHubAppRepositoryInstallation -Repository $env:GITHUB_REPOSITORY -Jwt $jwt
            Assert-SflGitHubAppInstallation -Installation $installation -Repository $env:GITHUB_REPOSITORY `
              -ExpectedAppId '4448946' -ExpectedClientId 'Iv23liwvwJJUh2bUIKLW' -ExpectedOwner $env:EXPECTED_OWNER
            $capture = [ordered]@{
              observed_at = [DateTimeOffset]::UtcNow.ToString('o')
              repository_id = [long]$env:GITHUB_REPOSITORY_ID
              repository = $env:GITHUB_REPOSITORY
              reviewed_sha = $env:GITHUB_SHA
              run_url = "https://github.com/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)"
              app_id = [long]$identity.id
              client_id = [string]$identity.client_id
              owner = [string]$identity.owner.login
              installation_id = [long]$installation.id
              installation_owner = [string]$installation.account.login
              repository_selection = [string]$installation.repository_selection
              target_type = [string]$installation.target_type
              permission_ceiling_verified = $true
              credential_verification = 'success'
            }
            $capture | ConvertTo-Json -Depth 4 |
              Set-Content -LiteralPath ./sfl-app-credential-metadata.json -Encoding utf8
            "Validated existing credential, App/client identity, owner, source installation and permission ceiling at $($env:GITHUB_SHA)." |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'This GET-only proof does not verify model credentials, all-repository coverage or a working PR review runtime.' |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          catch {
            throw 'Owned SFL App credential or installation verification failed. Credential values are not reported.'
          }
          finally {
            $jwt = $null
            Remove-Item Env:SFL_APP_PRIVATE_KEY -ErrorAction SilentlyContinue
          }
      - name: Upload public App installation metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sfl-app-credential-metadata
          path: sfl-app-credential-metadata.json
          if-no-files-found: error
          retention-days: 30
