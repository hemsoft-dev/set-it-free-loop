name: Verify owned SFL App credential

on:
  workflow_dispatch:
    inputs:
      additional_targets:
        description: Owner-verified extra organization targets as a JSON repository_id/repository array
        required: false
        default: '[]'
        type: string

permissions:
  contents: read

concurrency:
  group: verify-sfl-app-credential
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository_id == '1169772257' &&
      (github.repository == 'HemSoft/set-it-free-loop' ||
       github.repository == 'hemsoft-dev/set-it-free-loop') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify App identity and repository installations with scoped metadata access
        shell: pwsh
        env:
          SFL_APP_ID: ${{ vars.SFL_APP_ID }}
          SFL_APP_CLIENT_ID: ${{ vars.SFL_APP_CLIENT_ID }}
          SFL_APP_PRIVATE_KEY: ${{ secrets.SFL_APP_PRIVATE_KEY }}
          EXPECTED_OWNER: ${{ github.repository_owner }}
          ADDITIONAL_COVERAGE_TARGETS: ${{ inputs.additional_targets }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SFL_APP_ID -cne '4448946' -or
              $env:SFL_APP_CLIENT_ID -cne 'Iv23liwvwJJUh2bUIKLW') {
            throw 'Configured public App identity does not match the approved SFL App.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SFL_APP_PRIVATE_KEY)) {
            throw 'The source repository has no SFL App credential available.'
          }
          Import-Module ./deployment/scripts/SflGitHubAppBootstrap.psm1 -Force
          $coverageRepository = $env:GITHUB_REPOSITORY
          try {
            $jwt = ConvertTo-SflGitHubAppJwt -ClientId $env:SFL_APP_CLIENT_ID -PrivateKeyPem $env:SFL_APP_PRIVATE_KEY
            Write-Output "::add-mask::$jwt"
            $identity = Get-SflGitHubAppIdentity -Jwt $jwt
            Assert-SflGitHubAppIdentity -Identity $identity -ExpectedAppId '4448946' `
              -ExpectedClientId 'Iv23liwvwJJUh2bUIKLW' -ExpectedOwner $env:EXPECTED_OWNER
            $installation = Get-SflGitHubAppRepositoryInstallation -Repository $env:GITHUB_REPOSITORY -Jwt $jwt
            Assert-SflGitHubAppInstallation -Installation $installation -Repository $env:GITHUB_REPOSITORY `
              -ExpectedAppId '4448946' -ExpectedClientId 'Iv23liwvwJJUh2bUIKLW' -ExpectedOwner $env:EXPECTED_OWNER
            $capture = [ordered]@{
              observed_at = [DateTimeOffset]::UtcNow.ToString('o')
              repository_id = [long]$env:GITHUB_REPOSITORY_ID
              repository = $env:GITHUB_REPOSITORY
              reviewed_sha = $env:GITHUB_SHA
              run_url = "https://github.com/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)"
              app_id = [long]$identity.id
              client_id = [string]$identity.client_id
              owner = [string]$identity.owner.login
              installation_id = [long]$installation.id
              installation_owner = [string]$installation.account.login
              repository_selection = [string]$installation.repository_selection
              target_type = [string]$installation.target_type
              permission_ceiling_verified = $true
              credential_verification = 'success'
            }
            $capture | ConvertTo-Json -Depth 4 |
              Set-Content -LiteralPath ./sfl-app-credential-metadata.json -Encoding utf8
            Import-Module ./deployment/scripts/SflOrganizationCoverage.psm1 -Force
            $inventory = Get-Content ./docs/organization-migration/inventory.json -Raw | ConvertFrom-Json
            $extras = @(
              [pscustomobject]@{repository_id=1408025382;repository='hemsoft-dev/sfl-migration-pilot-private'},
              [pscustomobject]@{repository_id=1408029795;repository='hemsoft-dev/sfl-migration-pilot-public'},
              [pscustomobject]@{repository_id=1409692659;repository='hemsoft-dev/sfl-migration-onboarding-proof'}
            )
            if (-not [string]::IsNullOrWhiteSpace($env:ADDITIONAL_COVERAGE_TARGETS)) {
              $additional = ConvertFrom-Json -InputObject $env:ADDITIONAL_COVERAGE_TARGETS -NoEnumerate
              if ($additional -isnot [array] -or $additional.Count -gt 5) {
                throw 'Additional coverage must be a JSON array with at most five owner-verified targets.'
              }
              $extras += $additional
            }
            $targets = @(Get-SflOrganizationCoverageTargets -Inventory $inventory -AdditionalTargets $extras)
            $coverage = @(Invoke-SflOrganizationCoverage -Targets $targets -Jwt $jwt)
            [ordered]@{
              observed_at = [DateTimeOffset]::UtcNow.ToString('o')
              reviewed_sha = $env:GITHUB_SHA
              run_id = [long]$env:GITHUB_RUN_ID
              app_id = 4448946
              installation_id = 169090497
              target_count = $coverage.Count
              repositories = $coverage
            } | ConvertTo-Json -Depth 20 |
              Set-Content -LiteralPath ./sfl-app-repository-coverage.json -Encoding utf8
            "Validated existing credential, App/client identity, owner, source installation and permission ceiling at $($env:GITHUB_SHA)." |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            "Verified repository-specific installation GETs for $($coverage.Count) approved organization targets; both retained personal repositories were excluded." |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'Repository verification uses GETs plus a RAM-only metadata token create/revoke lifecycle; it does not verify model credentials or a working PR review runtime.' |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          catch {
            throw "Owned SFL App read-only verification failed for $coverageRepository. Credential values are not reported."
          }
          finally {
            $jwt = $null
            Remove-Item Env:SFL_APP_PRIVATE_KEY -ErrorAction SilentlyContinue
          }
      - name: Upload public App installation metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sfl-app-credential-metadata
          path: sfl-app-credential-metadata.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload public repository installation coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sfl-app-repository-coverage
          path: sfl-app-repository-coverage.json
          if-no-files-found: error
          retention-days: 30
