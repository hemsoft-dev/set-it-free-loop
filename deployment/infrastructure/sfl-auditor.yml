# SFL Auditor — standard workflow (not gh-aw)
#
# Runs every 30 minutes (offset from dispatcher). Audits the relationship
# between issue labels and open pull requests. Detects and repairs state
# discrepancies to keep the agentic pipeline self-consistent.
# Never modifies PR content — only updates issues.
#
# DEPLOYMENT: Copy this file to the consumer repo's .github/workflows/ directory.

name: "SFL Auditor"

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: "gh-aw-SFL Auditor"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
    steps:
      - name: Verify SFL App configuration
        env:
          SFL_APP_ID: ${{ vars.SFL_APP_ID }}
          SFL_APP_CLIENT_ID: ${{ vars.SFL_APP_CLIENT_ID }}
          SFL_APP_PRIVATE_KEY: ${{ secrets.SFL_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in SFL_APP_ID SFL_APP_CLIENT_ID SFL_APP_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required SFL App credential: $name"
              exit 1
            fi
          done

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SFL_APP_ID }}
          private-key: ${{ secrets.SFL_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-checks: write
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Verify authentication
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if ! gh auth status 2>&1; then
            echo "::error::SFL GitHub App token is not valid"
            exit 1
          fi

          APP_LOGIN=$(gh api graphql -f query='{ viewer { login } }' --jq '.data.viewer.login')
          if [ "$APP_LOGIN" != "sfl-app[bot]" ]; then
            echo "::error::Expected sfl-app[bot], authenticated as $APP_LOGIN"
            exit 1
          fi

          if ! gh api installation/repositories --paginate --jq '.repositories[].full_name' |
            grep -qxF "$REPO"; then
            echo "::error::The SFL App installation cannot access $REPO"
            exit 1
          fi

      - name: Gather current state
        id: gather
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          gh issue list --repo "$REPO" --state open --label "agent:in-progress" \
            --json number,labels,title --limit 100 > /tmp/in_progress_issues.json

          IP_COUNT=$(jq 'length' /tmp/in_progress_issues.json)
          echo "Found $IP_COUNT in-progress issues"

          gh pr list --repo "$REPO" --state open \
            --json number,headRefName,labels,title --limit 100 > /tmp/all_prs.json

          jq '[.[] | select(.headRefName | startswith("agent-fix/issue-")) |
            . + {linkedIssue: (.headRefName | capture("agent-fix/issue-(?<num>[0-9]+)-") | .num | tonumber)}]' \
            /tmp/all_prs.json > /tmp/agent_prs.json

          PR_COUNT=$(jq 'length' /tmp/agent_prs.json)
          echo "Found $PR_COUNT open agent PRs"

          echo "discrepancies=0" >> "$GITHUB_OUTPUT"

      - name: "Check: orphaned agent:in-progress labels"
        id: orphaned-labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          FIXED=0

          for ISSUE_NUM in $(jq -r '.[].number' /tmp/in_progress_issues.json); do
            HAS_PR=$(jq --argjson n "$ISSUE_NUM" '[.[] | select(.linkedIssue == $n)] | length' /tmp/agent_prs.json)

            if [ "$HAS_PR" -eq 0 ]; then
              echo "Issue #$ISSUE_NUM has agent:in-progress but no matching open PR — resetting to agent:fixable"

              gh issue comment "$ISSUE_NUM" --repo "$REPO" \
                --body "⚠️ **SFL Auditor**: No open PR found for this issue. Resetting to \`agent:fixable\` so the issue processor can reclaim it on the next run."

              gh issue edit "$ISSUE_NUM" --repo "$REPO" --remove-label "agent:in-progress" 2>/dev/null || true
              gh issue edit "$ISSUE_NUM" --repo "$REPO" --add-label "agent:fixable"

              FIXED=$((FIXED + 1))
              echo "$ISSUE_NUM" >> /tmp/fixed_issues.txt
            fi
          done

          touch /tmp/fixed_issues.txt
          echo "orphaned_labels_fixed=$FIXED" >> "$GITHUB_OUTPUT"
          echo "Fixed $FIXED orphaned agent:in-progress labels"

      - name: "Check: conflicting labels"
        id: conflicting
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          FIXED=0

          ISSUES_WITH_BOTH=$(gh issue list --repo "$REPO" --state open \
            --label "agent:in-progress" --label "agent:fixable" \
            --json number --jq '.[].number')

          for ISSUE_NUM in $ISSUES_WITH_BOTH; do
            echo "Issue #$ISSUE_NUM has both agent:in-progress and agent:fixable — removing agent:fixable"
            gh issue edit "$ISSUE_NUM" --repo "$REPO" --remove-label "agent:fixable"
            FIXED=$((FIXED + 1))
          done

          echo "conflicting_fixed=$FIXED" >> "$GITHUB_OUTPUT"
          echo "Fixed $FIXED conflicting label issues"

      - name: "Check: orphaned agent PRs"
        id: orphaned-prs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          FOUND=0

          while IFS= read -r ROW; do
            PR_NUM=$(echo "$ROW" | jq '.number')
            LINKED_ISSUE=$(echo "$ROW" | jq '.linkedIssue')
            BRANCH=$(echo "$ROW" | jq -r '.headRefName')

            if grep -qxF "$LINKED_ISSUE" /tmp/fixed_issues.txt 2>/dev/null; then
              echo "Skipping PR #$PR_NUM — linked issue #$LINKED_ISSUE was already processed"
              continue
            fi

            HAS_LABEL=$(jq --argjson n "$LINKED_ISSUE" '[.[] | select(.number == $n)] | length' /tmp/in_progress_issues.json)

            if [ "$HAS_LABEL" -eq 0 ]; then
              echo "PR #$PR_NUM on branch $BRANCH — linked issue #$LINKED_ISSUE lacks agent:in-progress"

              gh issue comment "$LINKED_ISSUE" --repo "$REPO" \
                --body "ℹ️ **SFL Auditor**: PR #$PR_NUM exists on branch \`$BRANCH\` but this issue is no longer labeled \`agent:in-progress\`. A human should decide whether to close the PR or restore the label."

              FOUND=$((FOUND + 1))
            fi
          done < <(jq -c '.[]' /tmp/agent_prs.json)

          echo "orphaned_prs_found=$FOUND" >> "$GITHUB_OUTPUT"
          echo "Found $FOUND orphaned agent PRs"

      - name: "Check: stale unclaimed issues"
        id: stale-unclaimed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          FOUND=0
          TWO_HOURS_AGO=$(date -u -d '2 hours ago' '+%Y-%m-%dT%H:%M:%SZ')

          # Get agent:fixable issues that don't have blocking labels
          gh issue list --repo "$REPO" --state open --label "agent:fixable" \
            --json number,createdAt,labels,title --limit 100 > /tmp/fixable_issues.json

          while IFS= read -r ROW; do
            ISSUE_NUM=$(echo "$ROW" | jq '.number')
            CREATED=$(echo "$ROW" | jq -r '.createdAt')

            # Skip if not older than 2 hours
            if [[ "$CREATED" > "$TWO_HOURS_AGO" ]]; then
              continue
            fi

            # Skip if issue has blocking labels
            HAS_BLOCKING=$(echo "$ROW" | jq '[.labels[].name] | any(. == "agent:in-progress" or . == "agent:pause" or . == "agent:human-required" or . == "agent:escalated")')
            if [ "$HAS_BLOCKING" = "true" ]; then
              continue
            fi

            # Skip if already flagged
            ALREADY_FLAGGED=$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json comments \
              --jq '.comments[].body' | grep -c 'over 2 hours without being claimed' || echo 0)
            if [ "$ALREADY_FLAGGED" -gt 0 ]; then
              continue
            fi

            echo "Issue #$ISSUE_NUM has been agent:fixable for over 2 hours without being claimed"

            gh issue comment "$ISSUE_NUM" --repo "$REPO" \
              --body "⏰ **SFL Auditor**: This issue has been \`agent:fixable\` for over 2 hours without being claimed by the Issue Processor. This may indicate a pipeline stall. A human should investigate whether the Issue Processor is running correctly."

            FOUND=$((FOUND + 1))
          done < <(jq -c '.[]' /tmp/fixable_issues.json)

          echo "stale_unclaimed_found=$FOUND" >> "$GITHUB_OUTPUT"
          echo "Found $FOUND stale unclaimed issues"

      - name: "Check: stalled draft PRs without analyzer reviews"
        id: stalled-prs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          FOUND=0
          TWO_HOURS_AGO=$(date -u -d '2 hours ago' '+%Y-%m-%dT%H:%M:%SZ')

          # Get open draft agent PRs
          gh pr list --repo "$REPO" --state open --draft \
            --json number,headRefName,createdAt,body,comments,labels --limit 100 > /tmp/draft_prs.json

          while IFS= read -r ROW; do
            PR_NUM=$(echo "$ROW" | jq '.number')
            CREATED=$(echo "$ROW" | jq -r '.createdAt')

            # Skip if not older than 2 hours
            if [[ "$CREATED" > "$TWO_HOURS_AGO" ]]; then
              continue
            fi

            # Check for required analyzer markers in PR body.
            BODY=$(echo "$ROW" | jq -r '.body // ""')
            LABELS=$(echo "$ROW" | jq -c '[.labels[].name]')
            REQUIRED_ANALYZERS='["pr-analyzer-general"]'
            if echo "$LABELS" | jq -e 'index("pr-analyzer-quality")' > /dev/null 2>&1; then
              REQUIRED_ANALYZERS=$(echo "$REQUIRED_ANALYZERS" | jq -c '. + ["pr-analyzer-quality"]')
            fi
            if echo "$LABELS" | jq -e 'index("pr-analyzer-security")' > /dev/null 2>&1; then
              REQUIRED_ANALYZERS=$(echo "$REQUIRED_ANALYZERS" | jq -c '. + ["pr-analyzer-security"]')
            fi
            if echo "$LABELS" | jq -e 'index("pr-analyzer-testing")' > /dev/null 2>&1; then
              REQUIRED_ANALYZERS=$(echo "$REQUIRED_ANALYZERS" | jq -c '. + ["pr-analyzer-testing"]')
            fi

            MISSING_MARKERS=$(echo "$REQUIRED_ANALYZERS" | jq -r '.[]' | while read -r ANALYZER; do
              if ! echo "$BODY" | grep -qF "[MARKER:$ANALYZER cycle:"; then
                echo "$ANALYZER"
              fi
            done | paste -sd ',' -)

            if [ -z "$MISSING_MARKERS" ]; then
              continue
            fi

            # Check if already flagged. Keep the text fallbacks for comments
            # created before the stable marker was introduced.
            COMMENTS=$(echo "$ROW" | jq -r '.comments[].body // ""')
            if echo "$COMMENTS" | grep -Eq \
              '<!-- sfl-auditor:stalled-pr-missing-analyzers -->|\*\*SFL Auditor\*\*: Draft PR #[0-9]+ .*missing (one or more )?(required )?analyzer markers'; then
              continue
            fi

            echo "Draft PR #$PR_NUM is older than 2 hours and missing required analyzer markers: $MISSING_MARKERS"

            gh pr comment "$PR_NUM" --repo "$REPO" \
              --body "<!-- sfl-auditor:stalled-pr-missing-analyzers -->
          ⏰ **SFL Auditor**: Draft PR #$PR_NUM has been open for over 2 hours and is missing one or more required analyzer markers ($MISSING_MARKERS). The PR Analyzers may not be dispatching for this PR. A human should investigate."

            FOUND=$((FOUND + 1))
          done < <(
            jq -c '[.[] | select(.headRefName | startswith("agent-fix/issue-"))] | .[]' \
              /tmp/draft_prs.json
          )

          echo "stalled_prs_found=$FOUND" >> "$GITHUB_OUTPUT"
          echo "Found $FOUND stalled draft PRs"

      - name: "Check: unexplained agent:pause"
        id: paused
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          FOUND=0

          PAUSED_ISSUES=$(gh issue list --repo "$REPO" --state open --label "agent:pause" \
            --json number --jq '.[].number')

          for ISSUE_NUM in $PAUSED_ISSUES; do
            HAS_EXPLANATION=$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json comments \
              --jq '.comments[].body' | grep -ciP 'pause[d]?|agent:pause' || echo 0)

            if [ "$HAS_EXPLANATION" -eq 0 ]; then
              echo "Issue #$ISSUE_NUM has agent:pause but no explanation comment"

              gh issue comment "$ISSUE_NUM" --repo "$REPO" \
                --body "🔍 **SFL Auditor**: This issue has \`agent:pause\` but no explanation comment was found. A human should add a comment explaining the pause, or remove the label to resume processing."

              FOUND=$((FOUND + 1))
            fi
          done

          echo "unexplained_pause_found=$FOUND" >> "$GITHUB_OUTPUT"
          echo "Found $FOUND unexplained pauses"

      - name: "Check: SFL review prerequisites"
        id: sfl-review-prerequisites
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          EXPECTED=0
          if MANIFEST=$(gh api "repos/$REPO/contents/sfl.json" --jq '.content' 2>/dev/null); then
            if echo "$MANIFEST" | base64 --decode | jq -e \
              '.components | index("sfl-pr-review") != null' >/dev/null; then
              EXPECTED=1
            fi
          fi

          if [ "$EXPECTED" -eq 0 ]; then
            echo "sfl_review_prerequisites_missing=0" >> "$GITHUB_OUTPUT"
            echo "Standalone SFL review is not declared in sfl.json — skipping prerequisite check"
            exit 0
          fi

          MISSING=0
          MISSING_ITEMS=""
          if ! gh api "repos/$REPO/actions/workflows/sfl-pr-review.lock.yml" >/dev/null 2>&1; then
            echo "::warning::Missing active workflow .github/workflows/sfl-pr-review.lock.yml"
            MISSING=$((MISSING + 1))
            MISSING_ITEMS="${MISSING_ITEMS}- [ ] Deploy \`.github/workflows/sfl-pr-review.lock.yml\`"$'\n'
          fi

          REVIEW_LOCK=""
          if REVIEW_LOCK_B64=$(gh api "repos/$REPO/contents/.github/workflows/sfl-pr-review.lock.yml" --jq '.content' 2>/dev/null); then
            REVIEW_LOCK=$(echo "$REVIEW_LOCK_B64" | base64 --decode)
          fi
          if [ -n "$REVIEW_LOCK" ] && { \
            ! grep -q '"allow-only"' <<< "$REVIEW_LOCK" || \
            ! grep -q '"write-sink"' <<< "$REVIEW_LOCK"; \
          }; then
            echo "::warning::Malformed SFL review guard policies in .github/workflows/sfl-pr-review.lock.yml"
            MISSING=$((MISSING + 1))
            MISSING_ITEMS="${MISSING_ITEMS}- [ ] Redeploy \`.github/workflows/sfl-pr-review.lock.yml\` with generated \`allow-only\` and \`write-sink\` guard policies"$'\n'
          fi

          if ! gh api "repos/$REPO/labels/sfl-review" >/dev/null 2>&1; then
            echo "::warning::Missing required label sfl-review"
            MISSING=$((MISSING + 1))
            MISSING_ITEMS="${MISSING_ITEMS}- [ ] Create the \`sfl-review\` label"$'\n'
          fi

          REVIEW_SOURCE=""
          if REVIEW_SOURCE_B64=$(gh api "repos/$REPO/contents/.github/workflows/sfl-pr-review.md" --jq '.content' 2>/dev/null); then
            REVIEW_SOURCE=$(echo "$REVIEW_SOURCE_B64" | base64 --decode)
          fi
          if [ -z "$REVIEW_SOURCE" ]; then
            echo "::warning::Missing source workflow .github/workflows/sfl-pr-review.md"
            MISSING=$((MISSING + 1))
            MISSING_ITEMS="${MISSING_ITEMS}- [ ] Deploy \`.github/workflows/sfl-pr-review.md\`"$'\n'
          elif ! grep -q '^Deployed from: HemSoft/set-it-free-loop/' <<< "$REVIEW_SOURCE" || \
            grep -Eq '^# (Deployed from|To upgrade):' <<< "$REVIEW_SOURCE"; then
            echo "::warning::Malformed SFL source provenance in .github/workflows/sfl-pr-review.md"
            MISSING=$((MISSING + 1))
            MISSING_ITEMS="${MISSING_ITEMS}- [ ] Redeploy \`.github/workflows/sfl-pr-review.md\` with non-heading source provenance"$'\n'
          fi

          ISSUE_TITLE="[SFL Auditor] Missing SFL review prerequisites"
          EXISTING_ISSUE=$(gh issue list --repo "$REPO" --state open \
            --search "\"$ISSUE_TITLE\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" |
            head -n 1)

          if [ "$MISSING" -gt 0 ] && [ -z "$EXISTING_ISSUE" ]; then
            ISSUE_BODY=$(printf '%s\n\n## Missing prerequisites\n\n%s## Recovery\n\n%s' \
              "The repository declares \`sfl-pr-review\` in \`sfl.json\`, but the standalone reviewer is missing or malformed." \
              "$MISSING_ITEMS" \
              "Run \`deployment/scripts/deploy-workflow.ps1 -Tier review\` and \`deployment/governance/setup-labels.ps1\` from \`HemSoft/set-it-free-loop\`.")
            gh issue create --repo "$REPO" \
              --title "$ISSUE_TITLE" \
              --label report \
              --body "$ISSUE_BODY"
          elif [ "$MISSING" -eq 0 ] && [ -n "$EXISTING_ISSUE" ]; then
            gh issue close "$EXISTING_ISSUE" --repo "$REPO" \
              --comment "✅ **SFL Auditor**: The standalone SFL review workflow, guard policies, source provenance, and trigger label are valid again."
          fi

          echo "sfl_review_prerequisites_missing=$MISSING" >> "$GITHUB_OUTPUT"
          echo "Found $MISSING missing SFL review prerequisite(s)"

      - name: Summary
        run: |
          ORPHANED_LABELS="${{ steps.orphaned-labels.outputs.orphaned_labels_fixed }}"
          CONFLICTING="${{ steps.conflicting.outputs.conflicting_fixed }}"
          ORPHANED_PRS="${{ steps.orphaned-prs.outputs.orphaned_prs_found }}"
          STALE_UNCLAIMED="${{ steps.stale-unclaimed.outputs.stale_unclaimed_found }}"
          STALLED_PRS="${{ steps.stalled-prs.outputs.stalled_prs_found }}"
          PAUSED="${{ steps.paused.outputs.unexplained_pause_found }}"
          SFL_REVIEW_PREREQUISITES="${{ steps.sfl-review-prerequisites.outputs.sfl_review_prerequisites_missing }}"

          TOTAL=$((ORPHANED_LABELS + CONFLICTING + ORPHANED_PRS + STALE_UNCLAIMED + STALLED_PRS + PAUSED + SFL_REVIEW_PREREQUISITES))

          {
            echo "## SFL Auditor Summary"
            echo ""
            echo "| Check | Count |"
            echo "|-------|-------|"
            echo "| Orphaned in-progress labels fixed | $ORPHANED_LABELS |"
            echo "| Conflicting labels fixed | $CONFLICTING |"
            echo "| Orphaned agent PRs flagged | $ORPHANED_PRS |"
            echo "| Stale unclaimed issues flagged | $STALE_UNCLAIMED |"
            echo "| Stalled draft PRs flagged | $STALLED_PRS |"
            echo "| Unexplained pauses flagged | $PAUSED |"
            echo "| Missing SFL review prerequisites | $SFL_REVIEW_PREREQUISITES |"
            echo ""

            if [ "$TOTAL" -eq 0 ]; then
              echo "All checks passed — no discrepancies found."
            else
              echo "Found or addressed $TOTAL discrepancies."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
