# SFL Dispatcher — lightweight gate that prevents wasteful gh-aw runs
#
# Runs every 30 minutes and checks GitHub state with simple gh CLI calls.
# Only dispatches gh-aw workflows when there's actual work to do:
#   - Issue Processor: when agent:fixable issues exist
#   - PR Analyzer General: when draft PRs with agent:pr exist
#   - Specialty PR Analyzers: when matching pr-analyzer-* labels exist
#   - PR Fixer: when draft PRs have all required analyzer markers
#   - PR Promoter: when draft PRs are ready for promotion OR approved PRs await merge
#
# This eliminates ~240 no-op Copilot inference calls/day.
#
# DEPLOYMENT: Copy this file to the consumer repo's .github/workflows/ directory.
# Adjust workflow filenames in the Dispatch steps if your consumer uses different names.

name: "SFL Dispatcher"

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write

concurrency:
  group: "sfl-dispatcher"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SFL_APP_ID }}
          private-key: ${{ secrets.SFL_APP_PRIVATE_KEY }}

      - name: Check for fixable issues
        id: issues
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          COUNT=$(gh issue list --repo "$REPO" --label "agent:fixable" --state open --json number --jq 'length')
          echo "fixable_count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -gt 0 ]; then
            echo "Found $COUNT fixable issue(s) — will dispatch Issue Processor."
          else
            echo "No fixable issues — skipping Issue Processor."
          fi

      - name: Check for draft PRs with agent:pr
        id: prs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          PRS=$(gh pr list --repo "$REPO" --state open --draft --label "agent:pr" \
            --json number,body,labels,createdAt \
            --jq '[.[] | select(.labels | map(.name) | index("agent:human-required") | not)]')

          COUNT=$(echo "$PRS" | jq 'length')
          QUALITY_COUNT=$(echo "$PRS" | jq '[.[] | select([.labels[].name] | index("pr-analyzer-quality"))] | length')
          SECURITY_COUNT=$(echo "$PRS" | jq '[.[] | select([.labels[].name] | index("pr-analyzer-security"))] | length')
          TESTING_COUNT=$(echo "$PRS" | jq '[.[] | select([.labels[].name] | index("pr-analyzer-testing"))] | length')

          {
            echo "draft_pr_count=$COUNT"
            echo "quality_pr_count=$QUALITY_COUNT"
            echo "security_pr_count=$SECURITY_COUNT"
            echo "testing_pr_count=$TESTING_COUNT"
          } >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "No eligible draft PRs — skipping analyzers and fixer."
            echo "fixer_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found $COUNT eligible draft PR(s) — will dispatch General analyzer."
          echo "Specialty requests: quality=$QUALITY_COUNT security=$SECURITY_COUNT testing=$TESTING_COUNT"

          OLDEST=$(echo "$PRS" | jq -r 'sort_by(.createdAt) | .[0]')
          PR_NUMBER=$(echo "$OLDEST" | jq '.number')
          PR_BODY=$(echo "$OLDEST" | jq -r '.body // ""')
          PR_LABELS=$(echo "$OLDEST" | jq -c '[.labels[].name]')

          CYCLE=0
          for N in 1 2 3; do
            if echo "$PR_LABELS" | jq -e "index(\"pr:cycle-$N\")" > /dev/null 2>&1; then
              CYCLE=$N
            fi
          done

          REQUIRED_ANALYZERS='["pr-analyzer-general"]'
          if echo "$PR_LABELS" | jq -e 'index("pr-analyzer-quality")' > /dev/null 2>&1; then
            REQUIRED_ANALYZERS=$(echo "$REQUIRED_ANALYZERS" | jq -c '. + ["pr-analyzer-quality"]')
          fi
          if echo "$PR_LABELS" | jq -e 'index("pr-analyzer-security")' > /dev/null 2>&1; then
            REQUIRED_ANALYZERS=$(echo "$REQUIRED_ANALYZERS" | jq -c '. + ["pr-analyzer-security"]')
          fi
          if echo "$PR_LABELS" | jq -e 'index("pr-analyzer-testing")' > /dev/null 2>&1; then
            REQUIRED_ANALYZERS=$(echo "$REQUIRED_ANALYZERS" | jq -c '. + ["pr-analyzer-testing"]')
          fi

          MISSING_MARKERS=$(echo "$REQUIRED_ANALYZERS" | jq -r '.[]' | while read -r ANALYZER; do
            if ! echo "$PR_BODY" | grep -qF "[MARKER:$ANALYZER cycle:$CYCLE]"; then
              echo "$ANALYZER"
            fi
          done | paste -sd ',' -)

          if echo "$PR_BODY" | grep -qF "[MARKER:pr-fixer cycle:$CYCLE]"; then
            echo "PR #$PR_NUMBER already fixed in cycle $CYCLE — fixer not needed."
            echo "fixer_ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$MISSING_MARKERS" ]; then
            echo "PR #$PR_NUMBER has all required analyzer markers for cycle $CYCLE — will dispatch fixer."
            echo "fixer_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR #$PR_NUMBER missing required analyzer markers for cycle $CYCLE ($MISSING_MARKERS) — fixer not ready."
            echo "fixer_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch Issue Processor
        if: steps.issues.outputs.fixable_count != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Dispatching Issue Processor..."
          gh workflow run issue-processor.lock.yml --repo "$REPO"

      - name: Dispatch PR Analyzers
        if: steps.prs.outputs.draft_pr_count != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Dispatching PR Analyzer General..."
          gh workflow run pr-analyzer-general.lock.yml --repo "$REPO"
          if [ "${{ steps.prs.outputs.quality_pr_count }}" != "0" ]; then
            echo "Dispatching PR Analyzer Quality..."
            gh workflow run pr-analyzer-quality.lock.yml --repo "$REPO"
          fi
          if [ "${{ steps.prs.outputs.security_pr_count }}" != "0" ]; then
            echo "Dispatching PR Analyzer Security..."
            gh workflow run pr-analyzer-security.lock.yml --repo "$REPO"
          fi
          if [ "${{ steps.prs.outputs.testing_pr_count }}" != "0" ]; then
            echo "Dispatching PR Analyzer Testing..."
            gh workflow run pr-analyzer-testing.lock.yml --repo "$REPO"
          fi

      - name: Dispatch PR Fixer
        if: steps.prs.outputs.fixer_ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Dispatching PR Fixer..."
          gh workflow run pr-fixer.lock.yml --repo "$REPO"

      - name: Check for approved PRs awaiting merge
        id: approved
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          PRS=$(gh pr list --repo "$REPO" --state open --label "human:ready-for-review" \
            --json number,isDraft,reviews \
            --jq '[.[] | select(.isDraft == false)]')

          APPROVED=0
          for ROW in $(echo "$PRS" | jq -c '.[]'); do
            HAS_APPROVAL=$(echo "$ROW" | jq '[.reviews | group_by(.author.login) | .[] | last | select(.state == "APPROVED")] | length')
            if [ "$HAS_APPROVAL" -gt 0 ]; then
              APPROVED=$((APPROVED + 1))
            fi
          done

          echo "approved_count=$APPROVED" >> "$GITHUB_OUTPUT"

          if [ "$APPROVED" -gt 0 ]; then
            echo "Found $APPROVED approved PR(s) awaiting merge — will dispatch PR Promoter."
          else
            echo "No approved PRs awaiting merge."
          fi

      - name: Dispatch PR Promoter
        if: steps.prs.outputs.draft_pr_count != '0' || steps.approved.outputs.approved_count != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Dispatching PR Promoter..."
          gh workflow run pr-promoter.lock.yml --repo "$REPO"

      - name: Summary
        run: |
          PROMOTER_DISPATCHED="No"
          PROMOTER_REASON=""
          if [ "${{ steps.prs.outputs.draft_pr_count }}" != "0" ]; then
            PROMOTER_DISPATCHED="Yes"
            PROMOTER_REASON="${{ steps.prs.outputs.draft_pr_count }} draft PRs"
          fi
          if [ "${{ steps.approved.outputs.approved_count }}" != "0" ]; then
            PROMOTER_DISPATCHED="Yes"
            if [ -n "$PROMOTER_REASON" ]; then
              PROMOTER_REASON="$PROMOTER_REASON + ${{ steps.approved.outputs.approved_count }} approved PRs"
            else
              PROMOTER_REASON="${{ steps.approved.outputs.approved_count }} approved PRs"
            fi
          fi

          {
            echo "## SFL Dispatcher Summary"
            echo ""
            echo "| Workflow | Dispatched |"
            echo "|----------|------------|"

            if [ "${{ steps.issues.outputs.fixable_count }}" != "0" ]; then
              echo "| Issue Processor | Yes (${{ steps.issues.outputs.fixable_count }} fixable issues) |"
            else
              echo "| Issue Processor | No (0 fixable issues) |"
            fi

            if [ "${{ steps.prs.outputs.draft_pr_count }}" != "0" ]; then
              echo "| PR Analyzer General | Yes (${{ steps.prs.outputs.draft_pr_count }} draft PRs) |"
            else
              echo "| PR Analyzer General | No (0 draft PRs) |"
            fi

            echo "| PR Analyzer Quality | $([ "${{ steps.prs.outputs.quality_pr_count }}" != "0" ] && echo "Yes (${{ steps.prs.outputs.quality_pr_count }} requested)" || echo "No") |"
            echo "| PR Analyzer Security | $([ "${{ steps.prs.outputs.security_pr_count }}" != "0" ] && echo "Yes (${{ steps.prs.outputs.security_pr_count }} requested)" || echo "No") |"
            echo "| PR Analyzer Testing | $([ "${{ steps.prs.outputs.testing_pr_count }}" != "0" ] && echo "Yes (${{ steps.prs.outputs.testing_pr_count }} requested)" || echo "No") |"

            if [ "${{ steps.prs.outputs.fixer_ready }}" = "true" ]; then
              echo "| PR Fixer | Yes (markers complete) |"
            else
              echo "| PR Fixer | No (markers incomplete) |"
            fi

            if [ "$PROMOTER_DISPATCHED" = "Yes" ]; then
              echo "| PR Promoter | Yes ($PROMOTER_REASON) |"
            else
              echo "| PR Promoter | No (no draft or approved PRs) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
